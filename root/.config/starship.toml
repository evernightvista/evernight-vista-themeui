"$schema" = "https://starship.rs/config-schema.json"

format = """
[░▒▓](#a3aed2)\
$os\
$username\
$hostname\
[](bg:#ff0000 fg:#a3aed2)\
$directory\
[](fg:#ff0000 bg:#394260)\
$git_branch\
$git_status\
$git_state\
[](fg:#394260 bg:#212736)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$python\
$java\
$kotlin\
$php\
$haskell\
$docker_context\
$conda\
$pixi\
[](fg:#212736 bg:#1d2230)\
$time\
[ ](fg:#1d2230)\
$line_break\
$character"""

[os]
disabled = false
style = "bg:#a3aed2 fg:#090c0c"
format = "[ $symbol ]($style)"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "\uE900"
Gentoo = "󰣨"
Fedora = "\uE901"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CachyOS = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = false
style_user = "bg:#a3aed2 fg:#090c0c"
style_root = "bold bg:#a3aed2 fg:#8f1d2c"
format = "[$user ]($style)"

[hostname]
ssh_only = true
style = "bg:#a3aed2 fg:#090c0c"
format = "[@$hostname ]($style)"

[directory]
style = "fg:#ffffff bg:#ff0000"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:#394260"
format = "[[ $symbol $branch ](fg:#ff0000 bg:#394260)]($style)"

[git_status]
style = "bg:#394260"
format = "[[($all_status$ahead_behind )](fg:#ff0000 bg:#394260)]($style)"

[git_state]
style = "bg:#394260"
format = "[[ $state( $progress_current/$progress_total) ](fg:#d9a657 bg:#394260)]($style)"

[c]
symbol = ""
style = "bg:#212736"
format = "[[ $symbol ($version) ](fg:#ff0000 bg:#212736)]($style)"

[cpp]
symbol = ""
style = "bg:#212736"
format = "[[ $symbol ($version) ](fg:#ff0000 bg:#212736)]($style)"

[rust]
symbol = ""
style = "bg:#212736"
format = "[[ $symbol ($version) ](fg:#ff0000 bg:#212736)]($style)"

[golang]
symbol = ""
style = "bg:#212736"
format = "[[ $symbol ($version) ](fg:#ff0000 bg:#212736)]($style)"

[nodejs]
symbol = ""
style = "bg:#212736"
format = "[[ $symbol ($version) ](fg:#ff0000 bg:#212736)]($style)"

[bun]
symbol = ""
style = "bg:#212736"
format = "[[ $symbol ($version) ](fg:#ff0000 bg:#212736)]($style)"

[python]
symbol = ""
style = "bg:#212736"
format = "[[ $symbol ($version)( \\($virtualenv\\)) ](fg:#ff0000 bg:#212736)]($style)"

[java]
symbol = ""
style = "bg:#212736"
format = "[[ $symbol ($version) ](fg:#ff0000 bg:#212736)]($style)"

[kotlin]
symbol = ""
style = "bg:#212736"
format = "[[ $symbol ($version) ](fg:#ff0000 bg:#212736)]($style)"

[php]
symbol = ""
style = "bg:#212736"
format = "[[ $symbol ($version) ](fg:#ff0000 bg:#212736)]($style)"

[haskell]
symbol = ""
style = "bg:#212736"
format = "[[ $symbol ($version) ](fg:#ff0000 bg:#212736)]($style)"

[docker_context]
symbol = ""
style = "bg:#212736"
format = "[[ $symbol $context ](fg:#ff0000 bg:#212736)]($style)"
only_with_files = true

[conda]
symbol = ""
style = "bg:#212736"
format = "[[ $symbol $environment ](fg:#ff0000 bg:#212736)]($style)"

[pixi]
symbol = "󰏗"
style = "bg:#212736"
format = "[[ $symbol ($version)( $environment) ](fg:#ff0000 bg:#212736)]($style)"

[time]
disabled = false
time_format = "%R"
style = "bg:#1d2230"
format = "[[  $time ](fg:#a0a9cb bg:#1d2230)]($style)"

[character]
success_symbol = "[❯](bold #ff0000)"
error_symbol = "[❯](bold #e06c75)"
vimcmd_symbol = "[❮](bold #98c379)"
vimcmd_replace_one_symbol = "[❮](bold #c678dd)"
vimcmd_replace_symbol = "[❮](bold #c678dd)"
vimcmd_visual_symbol = "[❮](bold #e5c07b)"
